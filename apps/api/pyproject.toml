[project]
name = "revive-api"
version = "0.1.0"
description = "ReviveOS FastAPI control plane"
requires-python = ">=3.11"
dependencies = [
  "revive-core",
  "revive-agents",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "structlog>=24.1",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revive_api"]
