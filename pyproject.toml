[project]
name = "reviveos"
version = "0.1.0"
description = "ReviveOS - software runtime resurrection and reproducible infrastructure"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "jsonschema>=4.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["cli", "packages/core", "agents", "apps/api"]

[tool.uv.sources]
revive-core = { workspace = true }
revive-agents = { workspace = true }
revive-cli = { workspace = true }
revive-api = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["cli/src", "packages/core/src", "agents/src", "apps/api/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "requires_docker: integration test that requires a reachable Docker daemon",
]
# The sandbox denies the atomic temp-dir rename pytest uses for its cache.
# tmp_path is redirected to .pytest-work/ by tests/conftest.py for the same
# reason (the machine temp root is not writable here).
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"
# Never lint tool/dependency caches or generated trees (they are huge and not ours).
extend-exclude = [
  ".uv-cache",
  ".uv-python",
  ".tools",
  ".venv",
  ".pre-commit-cache",
  "node_modules",
  "apps/web/.next",
  "results",
  # pytest leaves these behind when the sandbox denies its temp-dir rename; the
  # ACLs are unreadable, which makes ruff abort its file walk.
  "pytest-cache-files-*",
  ".pytest-tmp",
  ".pytest-basetemp",
  ".pytest-work",
  ".scratch",
  ".tmp_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
