[project]
name = "revive-core"
version = "0.1.0"
description = "ReviveOS core domain, archaeology engine and environment inference"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "structlog>=24.1",
  "PyYAML>=6.0",
  "packaging>=24.0",
  "Jinja2>=3.1",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
# docker-py is only needed by DockerExecutionPort (T-SB-02).  The module imports
# it lazily so the core package and the Local/Fake execution ports keep working
# on machines without Docker (see docs: Windows sandbox denies the named pipe).
docker = ["docker>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revive_core"]
