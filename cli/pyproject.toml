[project]
name = "revive-cli"
version = "0.1.0"
description = "ReviveOS command line interface"
requires-python = ">=3.11"
dependencies = [
  "revive-core",
  "revive-agents",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.scripts]
revive = "revive_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revive_cli"]
