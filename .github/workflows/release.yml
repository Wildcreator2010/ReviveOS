name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/reviveos-api:${{ github.ref_name }}
      - name: Build and publish worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/reviveos-worker:${{ github.ref_name }}
      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/reviveos-web:${{ github.ref_name }}
      - name: Resolve published digests
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          for image in reviveos-api reviveos-worker reviveos-web; do
            docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/$image:${{ github.ref_name }}" --format '{{json .Manifest.Digest}}'
          done | tr -d '"' > published-digests.txt
          test "$(wc -l < published-digests.txt)" -eq 3
      - name: Scan published images
        shell: bash
        run: |
          set -euo pipefail
          for image in reviveos-api reviveos-worker reviveos-web; do
            docker pull "ghcr.io/${{ github.repository_owner }}/$image:${{ github.ref_name }}"
            trivy image --severity HIGH,CRITICAL --exit-code 1 "ghcr.io/${{ github.repository_owner }}/$image:${{ github.ref_name }}"
            syft "ghcr.io/${{ github.repository_owner }}/$image:${{ github.ref_name }}" -o cyclonedx-json > "sbom-$image.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-supply-chain
          path: |
            published-digests.txt
            sbom-*.json
