name: release

# Tag-driven supply-chain pipeline. The runner does NOT ship trivy/syft by default,
# so both come from their official actions instead of a bare `trivy`/`syft` command.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  # Tag the whole run with the release version so SBOM/digest artifacts are traceable.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: worker
            dockerfile: Dockerfile.worker
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/reviveos-${{ matrix.name }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Record immutable digest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s=%s\n' "${{ matrix.name }}" "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.name }}.txt"
          cat "digest-${{ matrix.name }}.txt"

      - name: Vulnerability gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/reviveos-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/reviveos-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cyclonedx.json
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-${{ matrix.name }}
          path: |
            digest-${{ matrix.name }}.txt
            sbom-${{ matrix.name }}.cyclonedx.json
          if-no-files-found: error
