server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;

  # Next exports dynamic routes once under <route>/__runtime__/. Map direct
  # links and refreshes for /jobs/<id>, /projects/<id>[/<tab>], /capsules/<id>
  # onto that shell instead of the dashboard index.
  location ~ ^/(jobs|capsules)/(?!__runtime__)([^/]+)/?(.*)$ {
    try_files /$1/__runtime__/$3 /$1/__runtime__/index.html /index.html;
  }
  location ~ ^/projects/(?!__runtime__)([^/]+)/?(.*)$ {
    try_files /projects/__runtime__/$2 /projects/__runtime__/index.html /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
