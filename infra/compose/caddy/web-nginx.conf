server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Next exports dynamic routes once under <route>/__runtime__/. Map direct
  # links and refreshes for /jobs/<id>, /projects/<id>[/<tab>], /capsules/<id>
  # onto that shell instead of the dashboard index.
  location ~ ^/(jobs|capsules)/(?!__runtime__)([^/]+)/?(.*)$ {
    try_files /$1/__runtime__/$3 /$1/__runtime__/index.html /index.html;
  }
  location ~ ^/projects/(?!__runtime__)([^/]+)/?(.*)$ {
    try_files /projects/__runtime__/$2 /projects/__runtime__/index.html /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
