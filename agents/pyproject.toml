[project]
name = "revive-agents"
version = "0.1.0"
description = "ReviveOS LLM agents, prompts and orchestration"
requires-python = ">=3.11"
dependencies = [
  "revive-core",
  "httpx>=0.27",
  "pydantic>=2.7",
  "structlog>=24.1",
  "openai>=1.40",
  "anthropic>=0.34",
]

[project.optional-dependencies]
graph = ["langgraph>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revive_agents"]
